---

name: Complete DevOps Project CI

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set Short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
  
      - name: Build Docker image
        run: docker build -t cabhub/cdp:${{ env.SHORT_SHA }} .
        
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
      
      - name: Push Docker image
        run: docker push cabhub/cdp:${{ env.SHORT_SHA }}

      - name: Configure git author
        run: |
          git config --global user.name "dammyng"
          git config --global user.email "eidetic@outlook.com"

      - name: Update Helm values.yaml
        run: |
          sed -i "s|tag:.*|tag: \"${{ env.SHORT_SHA }}\"|" cdp-time/values.yaml
          git add cdp-time/values.yaml
          git commit -m "Update image tag to ${{ env.SHORT_SHA }}"
          git push origin main